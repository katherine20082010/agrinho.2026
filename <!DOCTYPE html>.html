<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agro Quiz</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 30px;
      max-width: 800px;
      width: 90%;
      color: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 2.5em;
      text-align: center;
      margin-bottom: 10px;
      color: #0f0;
    }
    h2 {
      text-align: center;
      font-weight: 300;
      margin-bottom: 20px;
    }
    .question {
      margin-bottom: 20px;
    }
    .question h3 {
      margin-bottom: 10px;
    }
    button {
      display: block;
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #4caf50, #2e7d32);
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }
    button:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #66bb6a, #388e3c);
    }
    #result {
      margin-top: 20px;
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AGRO FORTE, FUTURO SUSTENTÁVEL</h1>
    <h2>"Responda as 15 perguntas e melhore seu conhecimento sobre o agro do Brasil."</h2>
    
    <div id="quiz"></div>
    <button onclick="checkAnswers()">Finalizar Quiz</button>
    <div id="result"></div>
  </div>

  <script>
    const questions = [
      {
        q: "Qual é o maior produtor de soja do Brasil?",
        options: ["Paraná", "Mato Grosso", "Bahia", "Rio Grande do Sul"],
        answer: 1
      },
      {
        q: "O que significa 'agro'?",
        options: ["Tecnologia", "Agronegócio", "Indústria", "Comércio"],
        answer: 1
      },
      // ➡️ Continue adicionando até 15 perguntas
    ];

    const quizContainer = document.getElementById("quiz");

    questions.forEach((item, index) => {
      const div = document.createElement("div");
      div.classList.add("question");
      div.innerHTML = `<h3>${index+1}. ${item.q}</h3>`;
      item.options.forEach((opt, i) => {
        div.innerHTML += `
          <label>
            <input type="radio" name="q${index}" value="${i}"> ${opt}
          </label><br>`;
      });
      quizContainer.appendChild(div);
    });

    function checkAnswers() {
      let score = 0;
      questions.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if (selected && parseInt(selected.value) === item.answer) {
          score++;
        }
      });
      let message = "";
      if (score <= 5) message = "Você pode melhorar! 🌱";
      else if (score <= 10) message = "Bom desempenho! 🚜";
      else message = "Excelente! Você domina o agro brasileiro! 🏆";

      document.getElementById("result").innerHTML = `Acertos: ${score}/${questions.length}<br>${message}`;
    }
  </script>
</body>
</html>
