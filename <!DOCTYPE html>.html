<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Forte</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #228B22;
            color: white;
            text-align: center;
            padding: 20px;
        }
        header h1 {
            margin: 0;
        }
        .banner {
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/6/6d/Soybean_field.jpg');
            background-size: cover;
            background-position: center;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 2px 2px 5px #000;
        }
        .conteudo {
            padding: 40px;
            text-align: center;
        }
        .conteudo h2 {
            color: #228B22;
        }
        .conteudo p {
            font-size: 18px;
            line-height: 1.6;
        }
        footer {
            background-color: #228B22;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Agro Forte</h1>
        <p>O Brasil que alimenta o mundo</p>
    </header>

    <div class="banner">
        Plantação de Soja - Orgulho do Agro
    </div>
